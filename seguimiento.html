<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento · BYSG</title><link rel="stylesheet" href="sistema.css"></head><body>
<header class="topbar"><div class="shell"><a class="brand" href="index.html"><img src="assets/branding/gato-logo.png" alt="Logo BYSG"><span>BAUTI Y SUS GATOS<small>SEGUIMIENTO</small></span></a><a class="button-secondary" href="index.html">Volver a la tienda</a></div></header>
<main class="shell"><div class="eyebrow">TU PEDIDO</div><h1>¿En qué etapa está?</h1><p class="lead">Abrí el enlace recibido al comprar o pegá el código privado del pedido.</p>
  <div id="message" class="notice danger hidden"></div>
  <section id="lookupCard" class="card section" style="max-width:680px"><form id="lookupForm" class="form-grid"><div class="field full"><label for="tokenInput">Código privado del pedido</label><input id="tokenInput" required autocomplete="off"></div><div class="field full"><button class="button" type="submit">Consultar pedido</button></div></form></section>
  <section id="result" class="grid two section hidden"><article class="card"><div class="eyebrow">PEDIDO <span data-order-number></span></div><h2 data-order-status>—</h2><div id="orderDetail"></div><div id="tracking" class="notice info hidden section"></div></article><aside class="card"><h2>Historial</h2><div id="timeline" class="timeline"></div></aside></section>
</main><script src="sistema.js"></script><script>
(()=>{const {api,money,dateTime,query,escapeHtml,statusLabel,setMessage}=BYSG,message=document.getElementById('message'),form=document.getElementById('lookupForm'),input=document.getElementById('tokenInput');async function lookup(token){try{const order=await api(`/api/orders/${encodeURIComponent(token)}`);document.getElementById('lookupCard').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.querySelector('[data-order-number]').textContent=order.order_number;document.querySelector('[data-order-status]').textContent=statusLabel(order.order_status);document.getElementById('orderDetail').innerHTML=`<div class="items">${order.items.map(item=>`<article class="item"><div><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.size_label)} · Cantidad ${item.quantity}</small></div><span>${money(item.line_total_cents)}</span></article>`).join('')}</div>`;document.getElementById('timeline').innerHTML=order.events.map(event=>`<article><strong>${statusLabel(event.event_type)}</strong><div>${escapeHtml(event.detail)}</div><small>${dateTime(event.created_at)}</small></article>`).join('');if(order.tracking_code){const tracking=document.getElementById('tracking');tracking.classList.remove('hidden');tracking.innerHTML=`${escapeHtml(order.tracking_provider||'Correo')}: <strong>${escapeHtml(order.tracking_code)}</strong>${order.tracking_url?` · <a href="${escapeHtml(order.tracking_url)}" rel="noreferrer">Ver seguimiento</a>`:''}`}}catch(error){setMessage(message,error.message)}}form.addEventListener('submit',event=>{event.preventDefault();const token=input.value.trim();history.replaceState({},'',`?token=${encodeURIComponent(token)}`);lookup(token)});const token=query('token');if(token){input.value=token;lookup(token)}})();
</script></body></html>

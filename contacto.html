<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto · BYSG</title><link rel="stylesheet" href="sistema.css"></head><body>
<header class="topbar"><div class="shell"><a class="brand" href="index.html"><img src="assets/branding/gato-logo.png" alt="Logo BYSG"><span>BAUTI Y SUS GATOS<small>CONTACTO</small></span></a><a class="button-secondary" href="index.html">Volver a la tienda</a></div></header>
<main class="legal-shell"><div class="legal-hero"><div class="eyebrow">ESTAMOS PARA AYUDARTE</div><h1>Contacto</h1><p class="lead">Dejanos tu consulta y quedará disponible en el panel de administración.</p></div><section class="legal-card contact-card"><p><strong>Correo comercial:</strong> <a data-public-email href="#contactForm">provisorio, disponible desde la tienda</a></p><p><strong>Domicilio comercial:</strong> <span data-public-text="business_address">informado en la tienda</span></p><form id="contactForm" class="form-grid"><div class="field full"><label for="name">Nombre</label><input id="name" name="name" maxlength="120" required></div><div class="field full"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" maxlength="160" required></div><div class="field full"><label for="contactMessage">Consulta</label><textarea id="contactMessage" name="message" maxlength="2000" required placeholder="Si consultás por una compra, incluí el número de pedido."></textarea></div><div class="field full"><button class="button" type="submit">Enviar consulta</button></div></form><div id="result" class="notice contact-status hidden"></div><nav class="legal-nav"><a href="preguntas-frecuentes.html">Preguntas frecuentes</a><a href="seguimiento.html">Seguir pedido</a></nav></section></main>
<script src="sistema.js"></script><script src="public-config.js"></script><script>document.getElementById('contactForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,data=new FormData(form),result=document.getElementById('result'),button=form.querySelector('button');button.disabled=true;try{await BYSG.api('/api/contact',{method:'POST',body:JSON.stringify({name:data.get('name'),email:data.get('email'),message:data.get('message')})});BYSG.setMessage(result,'Recibimos tu consulta. Te responderemos por correo electrónico.','success');form.reset()}catch(error){BYSG.setMessage(result,error.message)}finally{button.disabled=false}})</script></body></html>

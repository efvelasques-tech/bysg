services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BYSG_HOST: 0.0.0.0
      BYSG_PORT: 4180
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./outputs:/app/outputs
    expose:
      - "4180"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      BYSG_DOMAIN: ${BYSG_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
